<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibio — Sign In | Creative Animated Experience</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      background: #050510;
    }

    /* ============================================
       CREATIVE PURE CSS ANIMATED BACKGROUND
       NO JAVASCRIPT - ALL HTML/CSS
       ============================================ */
    
    /* Main gradient with creative morphing */
    .creative-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: linear-gradient(125deg, 
        #0a0a2a, #1a0f2e, #0e1a3a, 
        #2a0f3a, #0f2a3a, #1a0f2e,
        #2a1a4a, #0a0a2a);
      background-size: 600% 600%;
      animation: creativeMorph 15s ease-in-out infinite;
    }

    @keyframes creativeMorph {
      0% { background-position: 0% 50%; filter: hue-rotate(0deg) brightness(1); }
      25% { background-position: 50% 30%; filter: hue-rotate(5deg) brightness(1.05); }
      50% { background-position: 100% 50%; filter: hue-rotate(10deg) brightness(1); }
      75% { background-position: 50% 70%; filter: hue-rotate(5deg) brightness(0.98); }
      100% { background-position: 0% 50%; filter: hue-rotate(0deg) brightness(1); }
    }

    /* Creative rotating geometric shapes - Pure CSS */
    .geometry-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .geo-shape {
      position: absolute;
      opacity: 0.2;
      animation: rotateShape 20s linear infinite;
    }

    .shape-1 {
      top: 10%;
      left: 5%;
      width: 300px;
      height: 300px;
      border: 2px solid rgba(139, 92, 246, 0.5);
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      animation: morphShape 12s ease-in-out infinite, floatShape 8s ease-in-out infinite;
    }

    .shape-2 {
      bottom: 15%;
      right: 8%;
      width: 400px;
      height: 400px;
      border: 2px solid rgba(236, 72, 153, 0.45);
      border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%;
      animation: morphShape2 15s ease-in-out infinite, floatShape 10s ease-in-out infinite reverse;
    }

    .shape-3 {
      top: 50%;
      left: 80%;
      width: 250px;
      height: 250px;
      border: 2px solid rgba(59, 130, 246, 0.5);
      border-radius: 73% 27% 56% 44% / 45% 61% 39% 55%;
      animation: morphShape3 18s ease-in-out infinite, floatShape 12s ease-in-out infinite;
    }

    .shape-4 {
      bottom: 30%;
      left: 15%;
      width: 350px;
      height: 350px;
      border: 2px solid rgba(168, 85, 247, 0.45);
      border-radius: 67% 33% 48% 52% / 38% 62% 38% 62%;
      animation: morphShape4 14s ease-in-out infinite, floatShape 9s ease-in-out infinite;
    }

    .shape-5 {
      top: 70%;
      right: 20%;
      width: 200px;
      height: 200px;
      border: 2px solid rgba(34, 211, 238, 0.5);
      border-radius: 45% 55% 35% 65% / 55% 45% 55% 45%;
      animation: morphShape5 20s ease-in-out infinite, floatShape 11s ease-in-out infinite;
    }

    @keyframes morphShape {
      0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: rotate(0deg); }
      50% { border-radius: 50% 50% 20% 80% / 25% 80% 20% 75%; transform: rotate(180deg); }
    }

    @keyframes morphShape2 {
      0%, 100% { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; transform: rotate(0deg); }
      50% { border-radius: 45% 55% 70% 30% / 40% 40% 60% 60%; transform: rotate(120deg); }
    }

    @keyframes morphShape3 {
      0%, 100% { border-radius: 73% 27% 56% 44% / 45% 61% 39% 55%; transform: rotate(0deg); }
      50% { border-radius: 35% 65% 45% 55% / 70% 30% 70% 30%; transform: rotate(240deg); }
    }

    @keyframes morphShape4 {
      0%, 100% { border-radius: 67% 33% 48% 52% / 38% 62% 38% 62%; transform: rotate(0deg); }
      50% { border-radius: 25% 75% 60% 40% / 55% 45% 55% 45%; transform: rotate(90deg); }
    }

    @keyframes morphShape5 {
      0%, 100% { border-radius: 45% 55% 35% 65% / 55% 45% 55% 45%; transform: rotate(0deg); }
      50% { border-radius: 60% 40% 50% 50% / 40% 60% 40% 60%; transform: rotate(60deg); }
    }

    @keyframes floatShape {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-20px) translateX(15px); }
    }

    @keyframes rotateShape {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Creative pulsing sound waves - Pure CSS */
    .sound-waves {
      position: fixed;
      bottom: 5%;
      left: 0;
      width: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .wave-circle {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 1px solid rgba(139, 92, 246, 0.5);
      animation: pulseWave 3s ease-out infinite;
    }

    .wave-circle:nth-child(1) { width: 150px; height: 150px; animation-delay: 0s; border-color: rgba(139, 92, 246, 0.6); }
    .wave-circle:nth-child(2) { width: 250px; height: 250px; animation-delay: 0.6s; border-color: rgba(168, 85, 247, 0.5); }
    .wave-circle:nth-child(3) { width: 350px; height: 350px; animation-delay: 1.2s; border-color: rgba(59, 130, 246, 0.5); }
    .wave-circle:nth-child(4) { width: 450px; height: 450px; animation-delay: 1.8s; border-color: rgba(236, 72, 153, 0.45); }
    .wave-circle:nth-child(5) { width: 550px; height: 550px; animation-delay: 2.4s; border-color: rgba(139, 92, 246, 0.4); }

    @keyframes pulseWave {
      0% {
        opacity: 0.8;
        transform: translateX(-50%) scale(0.2);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) scale(1.2);
      }
    }

    /* Creative floating musical notes - Pure CSS Emojis */
    .music-notes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .note {
      position: absolute;
      font-size: 28px;
      opacity: 0;
      animation: floatNote 14s ease-in infinite;
      filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.6));
    }

    /* Individual note positions and delays - Pure CSS creativity */
    .note-1 { left: 5%; animation-delay: 0s; animation-duration: 12s; content: "♪"; }
    .note-2 { left: 15%; animation-delay: 2s; animation-duration: 14s; }
    .note-3 { left: 25%; animation-delay: 4s; animation-duration: 10s; }
    .note-4 { left: 35%; animation-delay: 1s; animation-duration: 13s; }
    .note-5 { left: 45%; animation-delay: 3s; animation-duration: 11s; }
    .note-6 { left: 55%; animation-delay: 5s; animation-duration: 15s; }
    .note-7 { left: 65%; animation-delay: 2.5s; animation-duration: 12s; }
    .note-8 { left: 75%; animation-delay: 4.5s; animation-duration: 13s; }
    .note-9 { left: 85%; animation-delay: 1.5s; animation-duration: 11s; }
    .note-10 { left: 95%; animation-delay: 3.5s; animation-duration: 14s; }
    .note-11 { left: 10%; animation-delay: 6s; animation-duration: 16s; }
    .note-12 { left: 20%; animation-delay: 7s; animation-duration: 12s; }
    .note-13 { left: 30%; animation-delay: 8s; animation-duration: 13s; }
    .note-14 { left: 40%; animation-delay: 5.5s; animation-duration: 11s; }
    .note-15 { left: 50%; animation-delay: 6.5s; animation-duration: 14s; }
    .note-16 { left: 60%; animation-delay: 7.5s; animation-duration: 12s; }
    .note-17 { left: 70%; animation-delay: 8.5s; animation-duration: 15s; }
    .note-18 { left: 80%; animation-delay: 9s; animation-duration: 13s; }
    .note-19 { left: 90%; animation-delay: 4s; animation-duration: 11s; }
    .note-20 { left: 8%; animation-delay: 9.5s; animation-duration: 14s; }

    @keyframes floatNote {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
        transform: translateY(85vh) rotate(15deg) scale(1);
      }
      80% {
        opacity: 0.7;
        transform: translateY(15vh) rotate(340deg) scale(1);
      }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(0.5);
        opacity: 0;
      }
    }

    /* Creative dancing particles - Pure CSS animation */
    .dance-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .dance-particle {
      position: absolute;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.8), rgba(59, 130, 246, 0.4));
      border-radius: 50%;
      animation: danceMove 4s ease-in-out infinite;
    }

    @keyframes danceMove {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      25% {
        transform: translate(12px, -8px) scale(1.2);
      }
      50% {
        transform: translate(5px, -15px) scale(1.1);
      }
      75% {
        transform: translate(-8px, -5px) scale(0.9);
      }
    }

    /* Particle positions */
    .particle-1 { top: 15%; left: 10%; width: 6px; height: 6px; animation-delay: 0s; animation-duration: 3.5s; }
    .particle-2 { top: 25%; left: 85%; width: 8px; height: 8px; animation-delay: 0.5s; animation-duration: 4s; }
    .particle-3 { top: 45%; left: 20%; width: 5px; height: 5px; animation-delay: 1s; animation-duration: 3s; }
    .particle-4 { top: 65%; left: 75%; width: 7px; height: 7px; animation-delay: 1.5s; animation-duration: 4.5s; }
    .particle-5 { top: 80%; left: 40%; width: 4px; height: 4px; animation-delay: 2s; animation-duration: 3.2s; }
    .particle-6 { top: 35%; left: 55%; width: 9px; height: 9px; animation-delay: 2.5s; animation-duration: 3.8s; }
    .particle-7 { top: 55%; left: 88%; width: 5px; height: 5px; animation-delay: 3s; animation-duration: 4.2s; }
    .particle-8 { top: 70%; left: 12%; width: 6px; height: 6px; animation-delay: 0.8s; animation-duration: 3.3s; }
    .particle-9 { top: 18%; left: 45%; width: 7px; height: 7px; animation-delay: 1.2s; animation-duration: 3.6s; }
    .particle-10 { top: 85%; left: 68%; width: 5px; height: 5px; animation-delay: 2.2s; animation-duration: 4.1s; }
    .particle-11 { top: 48%; left: 32%; width: 8px; height: 8px; animation-delay: 0.3s; animation-duration: 3.4s; }
    .particle-12 { top: 62%; left: 92%; width: 6px; height: 6px; animation-delay: 1.8s; animation-duration: 3.9s; }
    .particle-13 { top: 28%; left: 62%; width: 4px; height: 4px; animation-delay: 2.8s; animation-duration: 4.3s; }
    .particle-14 { top: 52%; left: 8%; width: 7px; height: 7px; animation-delay: 3.2s; animation-duration: 3.7s; }
    .particle-15 { top: 75%; left: 50%; width: 5px; height: 5px; animation-delay: 0.2s; animation-duration: 4.4s; }

    /* Creative glowing orbs with trail */
    .trail-orbs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .trail-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      animation: trailMove 22s linear infinite;
    }

    .orb-1 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.5), rgba(59, 130, 246, 0.2));
      top: 20%;
      left: -100px;
      animation-duration: 20s;
    }

    .orb-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.45), rgba(99, 102, 241, 0.2));
      bottom: 10%;
      right: -150px;
      animation-duration: 26s;
      animation-direction: reverse;
    }

    .orb-3 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.5), rgba(139, 92, 246, 0.25));
      top: 60%;
      left: 70%;
      animation-duration: 24s;
    }

    .orb-4 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.45), rgba(139, 92, 246, 0.2));
      top: 75%;
      left: 15%;
      animation-duration: 28s;
      animation-delay: 3s;
    }

    @keyframes trailMove {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.5;
      }
      25% {
        transform: translate(80px, 40px) scale(1.2);
        opacity: 0.8;
      }
      50% {
        transform: translate(40px, 100px) scale(1.1);
        opacity: 0.6;
      }
      75% {
        transform: translate(-30px, 60px) scale(1.3);
        opacity: 0.7;
      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.5;
      }
    }

    /* Creative prism light effect */
    .prism-light {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0, 0, 0, 0.35) 100%);
      animation: prismShift 8s ease-in-out infinite;
    }

    @keyframes prismShift {
      0%, 100% {
        background: radial-gradient(circle at 30% 40%, transparent 0%, rgba(0, 0, 0, 0.35) 100%);
      }
      50% {
        background: radial-gradient(circle at 70% 60%, transparent 0%, rgba(0, 0, 0, 0.35) 100%);
      }
    }

    /* Creative twinkling stars - Pure CSS */
    .twinkling-stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2.5s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(1);
        box-shadow: 0 0 0px rgba(255, 255, 255, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1.3);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
      }
    }

    /* Star positions */
    .star-1 { top: 8%; left: 12%; width: 2px; height: 2px; animation-delay: 0s; }
    .star-2 { top: 15%; left: 78%; width: 3px; height: 3px; animation-delay: 0.5s; }
    .star-3 { top: 25%; left: 45%; width: 2px; height: 2px; animation-delay: 1s; }
    .star-4 { top: 35%; left: 88%; width: 2px; height: 2px; animation-delay: 1.5s; }
    .star-5 { top: 45%; left: 22%; width: 3px; height: 3px; animation-delay: 0.2s; }
    .star-6 { top: 55%; left: 65%; width: 2px; height: 2px; animation-delay: 0.8s; }
    .star-7 { top: 65%; left: 35%; width: 2px; height: 2px; animation-delay: 1.2s; }
    .star-8 { top: 72%; left: 92%; width: 3px; height: 3px; animation-delay: 1.8s; }
    .star-9 { top: 82%; left: 18%; width: 2px; height: 2px; animation-delay: 0.3s; }
    .star-10 { top: 92%; left: 55%; width: 2px; height: 2px; animation-delay: 0.9s; }
    .star-11 { top: 5%; left: 34%; width: 2px; height: 2px; animation-delay: 1.4s; }
    .star-12 { top: 18%; left: 52%; width: 3px; height: 3px; animation-delay: 2s; }
    .star-13 { top: 28%; left: 8%; width: 2px; height: 2px; animation-delay: 0.4s; }
    .star-14 { top: 38%; left: 72%; width: 2px; height: 2px; animation-delay: 1.1s; }
    .star-15 { top: 48%; left: 95%; width: 3px; height: 3px; animation-delay: 1.6s; }
    .star-16 { top: 58%; left: 42%; width: 2px; height: 2px; animation-delay: 0.1s; }
    .star-17 { top: 68%; left: 5%; width: 2px; height: 2px; animation-delay: 0.7s; }
    .star-18 { top: 78%; left: 82%; width: 3px; height: 3px; animation-delay: 1.3s; }
    .star-19 { top: 88%; left: 28%; width: 2px; height: 2px; animation-delay: 1.9s; }
    .star-20 { top: 95%; left: 68%; width: 2px; height: 2px; animation-delay: 0.6s; }

    /* ============================================
       MAIN CONTENT - CREATIVE GLASS DESIGN
       ============================================ */
    
    .main-wrapper {
      display: flex;
      width: 1150px;
      max-width: 92vw;
      min-height: auto;
      background: transparent;
      border-radius: 48px;
      overflow: visible;
      z-index: 20;
      position: relative;
      animation: creativeEntrance 0.8s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    @keyframes creativeEntrance {
      0% {
        opacity: 0;
        transform: scale(0.9) rotateX(-8deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotateX(0deg);
      }
    }

    .left-panel {
      flex: 1.1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 28px;
      background: transparent;
      animation: slideInLeft 0.8s ease-out;
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-60px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      padding: 38px 32px;
      border-radius: 40px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(139, 92, 246, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      animation: creativeGlow 3s ease-in-out infinite, formRise 0.7s ease-out 0.2s backwards;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15), transparent 70%);
      animation: rotateGlow 12s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes creativeGlow {
      0%, 100% {
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(139, 92, 246, 0.4);
      }
      50% {
        box-shadow: 0 30px 55px rgba(139, 92, 246, 0.35), 0 0 0 2px rgba(139, 92, 246, 0.7);
      }
    }

    @keyframes formRise {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container:hover {
      transform: translateY(-8px);
      background: rgba(0, 0, 0, 0.55);
    }

    h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-weight: 800;
      background: linear-gradient(120deg, #fff, #c4b5fd, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: creativeText 3s ease-in-out infinite;
    }

    @keyframes creativeText {
      0%, 100% {
        text-shadow: 0 0 0px rgba(167, 139, 250, 0);
        letter-spacing: -0.3px;
      }
      50% {
        text-shadow: 0 0 20px rgba(167, 139, 250, 0.6);
        letter-spacing: 1px;
      }
    }

    h1 img {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 10px rgba(139, 92, 246, 0.8));
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      padding: 6px;
      animation: creativeIcon 4s ease-in-out infinite;
    }

    @keyframes creativeIcon {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(12deg) scale(1.08); }
      75% { transform: rotate(-12deg) scale(1.08); }
    }

    form {
      display: flex;
      flex-direction: column;
    }

    .input-group {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #f0f3ff;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .input-group:hover label {
      transform: translateX(5px);
      color: #c4b5fd;
    }

    label span {
      font-size: 1.1rem;
      transition: transform 0.3s ease;
    }

    .input-group:hover label span {
      transform: scale(1.2) rotate(5deg);
    }

    input {
      padding: 14px 20px;
      border: none;
      border-radius: 40px;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      color: #f1f5f9;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      border: 1px solid rgba(139, 92, 246, 0.5);
    }

    input:focus {
      background: rgba(0, 0, 0, 0.75);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.4);
      outline: none;
      border-color: rgba(139, 92, 246, 0.9);
      transform: translateX(8px);
    }

    input::placeholder {
      color: #9ca3af;
      font-weight: 400;
      font-size: 13px;
    }

    button {
      background: linear-gradient(95deg, #5b21b6, #3b82f6);
      color: white;
      padding: 15px;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      margin-top: 20px;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);

  <script>
    document.getElementById('authForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('error-message');

      // Clear previous error
      errorDiv.style.display = 'none';

      // Validate passwords match
      if (password !== confirmPassword) {
        errorDiv.textContent = '❌ Passwords do not match!';
        errorDiv.style.display = 'block';
        return;
      }
      
      // Get existing users
      const users = JSON.parse(localStorage.getItem('vibio_users') || '[]');
      
      // Check if user exists
      if (users.find(u => u.email === email)) {
        errorDiv.textContent = '❌ Email already registered!';
        errorDiv.style.display = 'block';
        return;
      }

      // Add new user
      const newUser = {
        fullName: fullName,
        email: email,
        password: password
      };
      
      users.push(newUser);
      localStorage.setItem('vibio_users', JSON.stringify(users));
      
      // Set current user session
      localStorage.setItem('vibio_current_user', JSON.stringify({
        fullName: fullName,
        email: email
      }));
      
      // Redirect
      window.location.href = 'index.html';
    });
  </script>
