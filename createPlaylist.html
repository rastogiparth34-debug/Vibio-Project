<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Create Custom Playlist - Vibio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #050510;
            color: #edeef2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .split-layout {
            display: flex;
            flex: 1;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* LEFT SIDE: Form */
        .form-side {
            flex: 1;
            padding: 40px 60px;
            max-width: 800px;
        }

        .header-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .header-subtitle {
            color: var(--text-muted, #a2adcf);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 30px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modern-input {
            width: 100%;
            background: var(--input-bg, rgba(255,255,255,0.03));
            border: 1px solid var(--border-color, rgba(255,255,255,0.1));
            color: var(--text-main, #fff);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .modern-input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 0 4px rgba(192, 132, 252, 0.1);
            background: rgba(255,255,255,0.05);
        }

        textarea.modern-input {
            min-height: 120px;
            resize: vertical;
        }

        /* Horizontal Scrolling Cover Selector */
        .cover-selector-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            scroll-snap-type: x mandatory;
        }

        .cover-selector-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .cover-selector-scroll::-webkit-scrollbar-thumb {
            background: rgba(192, 132, 252, 0.5);
            border-radius: 10px;
        }

        .cover-option {
            width: 150px;
            height: 150px;
            flex-shrink: 0;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            scroll-snap-align: start;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .cover-option.selected {
            border-color: #c084fc;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(192, 132, 252, 0.4);
        }

        .cover-option.selected::after {
            content: '✓';
            position: absolute;
            top: 10px; right: 10px;
            background: #c084fc;
            color: #fff;
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Modern Select & Privacy Toggle */
        .modern-select {
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23c084fc%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
        }

        .privacy-toggles {
            display: flex;
            gap: 15px;
        }

        .privacy-btn {
            flex: 1;
            padding: 12px;
            background: var(--input-bg, rgba(255,255,255,0.03));
            border: 1px solid var(--border-color, rgba(255,255,255,0.1));
            border-radius: 12px;
            color: var(--text-muted);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .privacy-btn.active {
            background: rgba(192, 132, 252, 0.15);
            border-color: #c084fc;
            color: #c084fc;
            box-shadow: 0 5px 15px rgba(192, 132, 252, 0.2);
        }

        /* Action Buttons */
        .btn-create {
            width: 100%;
            background: var(--accent-gradient, linear-gradient(135deg, #c084fc, #60a5fa));
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(192, 132, 252, 0.4);
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-create:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(192, 132, 252, 0.6);
        }

        /* RIGHT SIDE: Live Preview */
        .preview-side {
            flex: 1;
            background: linear-gradient(135deg, rgba(18,22,32,0.8), rgba(5,5,16,0.9));
            border-left: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .preview-sticky {
            position: sticky;
            top: 100px;
            width: 100%;
            max-width: 450px;
        }

        .preview-label {
            text-align: center;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .preview-label span {
            display: inline-block;
            width: 10px; height: 10px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* The Live Preview Card */
        .preview-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            text-align: center;
            transition: all 0.3s ease;
        }

        .preview-cover-img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 16px;
            background-image: url('https://images.pexels.com/photos/1124600/pexels-photo-1124600.jpeg?auto=compress&cs=tinysrgb&w=400&h=400&fit=crop');
            background-size: cover;
            background-position: center;
            margin-bottom: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            transition: background-image 0.4s ease;
        }

        .preview-name {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .preview-desc {
            font-size: 1rem;
            color: #a2adcf;
            margin-bottom: 15px;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .preview-meta {
            display: inline-block;
            background: rgba(192, 132, 252, 0.2);
            color: #c084fc;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        @media (max-width: 1000px) {
            .split-layout { flex-direction: column; }
            .preview-side { border-left: none; border-top: 1px solid rgba(255,255,255,0.05); }
            .preview-sticky { position: static; }
        }
        @media (max-width: 600px) {
            .form-side {
                padding: 20px;
            }
            .preview-side {
                padding: 20px;
            }
            .header-title {
                font-size: 2rem;
            }
            .privacy-toggles {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>

    <div class="split-layout">
        <!-- Left Side: Form -->
        <div class="form-side">
            <h1 class="header-title">Create Playlist</h1>
            <p class="header-subtitle">Mix your own vibe. Curate your perfect collection.</p>

            <form id="create-playlist-form">
                <div class="form-group">
                    <label class="form-label">Name your vibe</label>
                    <input type="text" id="p-name" class="modern-input" placeholder="e.g., Midnight Drive, Punjabi Power..." value="My Desi Beats" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="p-desc" class="modern-input" placeholder="What's the vibe?">The perfect mix of hits.</textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Cover Art</label>
                    <div class="cover-selector-scroll">
                        <div class="cover-option selected" data-url="https://images.pexels.com/photos/1124600/pexels-photo-1124600.jpeg?auto=compress&cs=tinysrgb&w=400&h=400&fit=crop" style="background-image: url('https://images.pexels.com/photos/1124600/pexels-photo-1124600.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop');"></div>
                        
                        <div class="cover-option" data-url="https://images.pexels.com/photos/1389429/pexels-photo-1389429.jpeg?auto=compress&cs=tinysrgb&w=400&h=400&fit=crop" style="background-image: url('https://images.pexels.com/photos/1389429/pexels-photo-1389429.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop');"></div>
                        
                        <div class="cover-option" data-url="https://images.pexels.com/photos/1457075/pexels-photo-1457075.jpeg?auto=compress&cs=tinysrgb&w=400&h=400&fit=crop" style="background-image: url('https://images.pexels.com/photos/1457075/pexels-photo-1457075.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop');"></div>
                        
                        <div class="cover-option" data-url="https://marketplace.canva.com/EAGYFQxnznA/2/0/1600w/canva-pink-and-beige-gradient-retro-record-nostalgic-playlist-cover-SSPNk3f3w4k.jpg" style="background-image: url('https://marketplace.canva.com/EAGYFQxnznA/2/0/1600w/canva-pink-and-beige-gradient-retro-record-nostalgic-playlist-cover-SSPNk3f3w4k.jpg');"></div>
                        
                        <div class="cover-option" data-url="https://images.pexels.com/photos/1337753/pexels-photo-1337753.jpeg?auto=compress&cs=tinysrgb&w=400&h=400&fit=crop" style="background-image: url('https://images.pexels.com/photos/1337753/pexels-photo-1337753.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop');"></div>
                    </div>
                </div>

                <div style="display: flex; gap: 20px; margin-bottom: 30px;">
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label class="form-label">Genre</label>
                        <select id="p-genre" class="modern-input modern-select">
                            <option>Punjabi Bhangra</option>
                            <option>Haryanvi Folk</option>
                            <option>Desi Hip Hop</option>
                            <option>Bollywood</option>
                            <option>Mixed</option>
                        </select>
                    </div>
                    
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label class="form-label">Privacy</label>
                        <div class="privacy-toggles">
                            <div class="privacy-btn active" data-val="Public">🌍 Public</div>
                            <div class="privacy-btn" data-val="Private">🔒 Private</div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-create">Create Playlist ✨</button>
            </form>
        </div>

        <!-- Right Side: Live Preview -->
        <div class="preview-side">
            <div class="preview-sticky">
                <div class="preview-label">
                    <span></span> LIVE PREVIEW
                </div>
                
                <div class="preview-card">
                    <div class="preview-cover-img" id="prev-img"></div>
                    <h2 class="preview-name" id="prev-name">My Desi Beats</h2>
                    <p class="preview-desc" id="prev-desc">The perfect mix of hits.</p>
                    <div class="preview-meta" id="prev-meta">Punjabi Bhangra • Public</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="theme.js"></script>
    <script src="playlist_manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Live Preview Elements
            const pName = document.getElementById('p-name');
            const pDesc = document.getElementById('p-desc');
            const pGenre = document.getElementById('p-genre');
            
            const prevName = document.getElementById('prev-name');
            const prevDesc = document.getElementById('prev-desc');
            const prevMeta = document.getElementById('prev-meta');
            const prevImg = document.getElementById('prev-img');

            let currentPrivacy = 'Public';
            let currentCover = document.querySelector('.cover-option.selected').getAttribute('data-url');

            // Update Preview Function
            const updatePreview = () => {
                prevName.textContent = pName.value || 'Untitled Playlist';
                prevDesc.textContent = pDesc.value || 'No description';
                prevMeta.textContent = `${pGenre.value} • ${currentPrivacy}`;
                prevImg.style.backgroundImage = `url('${currentCover}')`;
            };

            // Event Listeners for Live Preview
            pName.addEventListener('input', updatePreview);
            pDesc.addEventListener('input', updatePreview);
            pGenre.addEventListener('change', updatePreview);

            // Cover Selector Logic
            const coverOptions = document.querySelectorAll('.cover-option');
            coverOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    coverOptions.forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    currentCover = opt.getAttribute('data-url');
                    updatePreview();
                });
            });

            // Privacy Toggle Logic
            const privacyBtns = document.querySelectorAll('.privacy-btn');
            privacyBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    privacyBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPrivacy = btn.getAttribute('data-val');
                    updatePreview();
                });
            });

            // Form Submit Logic
            document.getElementById('create-playlist-form').addEventListener('submit', (e) => {
                e.preventDefault();
                if(window.PlaylistManager) {
                    PlaylistManager.createPlaylist(pName.value, pDesc.value, currentCover, currentPrivacy, pGenre.value);
                    window.location.href = 'Playlist.html';
                }
            });
            
            // Initial call to set up preview
            updatePreview();
        });
    </script>
</body>
</html>
